name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach the zips to releases on version tags

env:
  QT_VERSION: "6.8.3"
  KF_VERSION: "6.10.0" # extra-cmake-modules + KSyntaxHighlighting

jobs:
  linux:
    name: Linux (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel qt6-base syntax-highlighting cmake ninja git
      - uses: actions/checkout@v4
      - name: Configure git for the tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 300

  linux-package:
    name: Linux zip (Ubuntu 22.04)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Qt and KSyntaxHighlighting
        uses: actions/cache@v4
        with:
          path: |
            /tmp/yadiff-package/qt
            /tmp/yadiff-package/kf6
          key: linux-package-qt${{ env.QT_VERSION }}-kf${{ env.KF_VERSION }}-v1
      - name: Build and package
        run: packaging/linux/package.sh
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: yadiff-linux-x64.zip
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: yadiff-linux-x64
          path: yadiff-linux-x64.zip
          retention-days: 14

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    env:
      KF_PREFIX: ${{ github.workspace }}\kf6
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache KSyntaxHighlighting
        id: kf-cache
        uses: actions/cache@v4
        with:
          path: kf6
          key: kf6-${{ env.KF_VERSION }}-qt${{ env.QT_VERSION }}-msvc2022

      - name: Build KSyntaxHighlighting
        if: steps.kf-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch "v$env:KF_VERSION" https://github.com/KDE/extra-cmake-modules.git ecm
          cmake -S ecm -B ecm/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$env:KF_PREFIX" -DBUILD_TESTING=OFF -DBUILD_HTML_DOCS=OFF -DBUILD_MAN_DOCS=OFF -DBUILD_QTHELP_DOCS=OFF
          cmake --build ecm/build --target install
          git clone --depth 1 --branch "v$env:KF_VERSION" https://github.com/KDE/syntax-highlighting.git ksh
          cmake -S ksh -B ksh/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$env:KF_PREFIX" -DCMAKE_PREFIX_PATH="$env:KF_PREFIX" -DBUILD_TESTING=OFF -DBUILD_QCH=OFF -DQT_MAJOR_VERSION=6
          cmake --build ksh/build --target install

      - name: Configure git for the tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:KF_PREFIX"
          cmake --build build

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$env:KF_PREFIX\bin;$env:PATH"
          ctest --test-dir build --output-on-failure --timeout 300

      - name: Show GUI test output
        if: failure()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          YADIFF_SYNCHRONOUS: "1"
          XDG_CONFIG_HOME: ${{ github.workspace }}\test-config
        run: |
          $env:PATH = "$env:KF_PREFIX\bin;$env:PATH"
          & build\test_navigation.exe -o test_navigation.txt,txt -o -,txt 2>&1 | Out-Host
          Write-Host "exit code: $LASTEXITCODE"
          Get-Content test_navigation.txt -ErrorAction SilentlyContinue | Select-String -Pattern 'FAIL|Loc:|Actual|Expected|QWARN' | Out-Host

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/yadiff | Out-Null
          Copy-Item build/yadiff.exe dist/yadiff/
          Copy-Item "$env:KF_PREFIX\bin\KF6SyntaxHighlighting*.dll" dist/yadiff/
          windeployqt --release --no-translations --no-compiler-runtime dist/yadiff/yadiff.exe
          # Ship the Visual C++ runtime DLLs app-locally (allowed by Microsoft), so the
          # zip runs without installing vc_redist first.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw "VC runtime redist folder not found under $env:VCToolsRedistDir" }
          Copy-Item "$($crt.FullName)\*.dll" dist/yadiff/
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md dist/yadiff/
          Compress-Archive -Path dist/yadiff -DestinationPath yadiff-windows-x64.zip -Force

      - name: Smoke test the package
        shell: pwsh
        run: |
          # The packaged exe must run on its own (no Qt or KF6 on PATH). --export is
          # headless; --version would open a message box in a GUI-subsystem exe.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Qt|kf6' }) -join ';'
          Set-Content a.txt "one`ntwo`n"
          Set-Content b.txt "one`nTWO`n"
          $p = Start-Process -FilePath dist/yadiff/yadiff.exe -ArgumentList '--no-index','a.txt','b.txt','--export','smoke.html' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "yadiff.exe hung" }
          if ($p.ExitCode -ne 0) { throw "yadiff.exe exited with $($p.ExitCode)" }
          if (-not (Select-String -Path smoke.html -Pattern '<!doctype html>' -Quiet)) { throw "no report written" }
          if (-not (Select-String -Path smoke.html -Pattern 'TWO' -Quiet)) { throw "report is missing the diff" }

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: yadiff-windows-x64.zip

      # A convenience copy of every build. Kept briefly, and never fails the job: a full
      # artifact quota mustn't stop a release.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: yadiff-windows-x64
          path: yadiff-windows-x64.zip
          retention-days: 14
